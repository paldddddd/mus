[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/desktop-host",
    "crates/render",
    "crates/library",
    "crates/media",
    "crates/governor",
    "crates/audio-engine",
    "crates/widget",
    "crates/daemon",
    "crates/html-host",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["wallmus Team"]
license = "Proprietary"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
windows = "0.58"
windows-core = "0.58"
