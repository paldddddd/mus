[package]
name = "wallmus-ui"
version = "0.1.0"
description = "wallmus user interface"
authors = ["wallmus Team"]
edition = "2021"

[lib]
name = "wallmus_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
common = { path = "../../crates/common" }

