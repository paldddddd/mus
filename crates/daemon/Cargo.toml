[package]
name = "wallmus"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wallmus"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
desktop-host = { path = "../desktop-host" }
render = { path = "../render" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
windows = { workspace = true, features = ["Win32_System_LibraryLoader"] }
